/* ===== v4: অ্যানিমেশন, থ্রিডি মানচিত্র, বিস্তারিত ===== */
.sc,.rrow .sc,.stat b,.facts b,.br small{font-variant-numeric:tabular-nums}

rem_c:["এখন সিটি কর্পোরেশনগুলোতে নির্বাচিত মেয়র ও কাউন্সিলরের পদ ফাঁকা, প্রশাসক দায়িত্বে আছেন। স্থানীয় সরকার নির্বাচনের পর এটা বদলাবে। তখন নির্বাচিত প্রতিনিধিদের কাছেও জানান।","City corporations currently have no elected mayor or councillors; administrators are in charge. This will change after local elections, and then you should also inform the elected representatives.","अभी सिटी कॉर्पोरेशनों में निर्वाचित मेयर और पार्षदों के पद खाली हैं, प्रशासक ज़िम्मेदारी में हैं। स्थानीय चुनाव के बाद यह बदलेगा, तब निर्वाचित प्रतिनिधियों को भी बताएँ।"],
rem_p:["এখন পৌরসভাগুলোতে নির্বাচিত মেয়র ও কাউন্সিলরের পদ ফাঁকা, প্রশাসক দায়িত্বে আছেন। স্থানীয় সরকার নির্বাচনের পর এটা বদলাবে। তখন নির্বাচিত প্রতিনিধিদের কাছেও জানান।","Pourashavas currently have no elected mayor or councillors; administrators are in charge. This will change after local elections, and then you should also inform the elected representatives.","अभी पौरसभाओं में निर्वाचित मेयर और पार्षदों के पद खाली हैं, प्रशासक ज़िम्मेदारी में हैं। स्थानीय चुनाव के बाद यह बदलेगा, तब निर्वाचित प्रतिनिधियों को भी बताएँ।"],
rem_u:["অনেক ইউনিয়ন পরিষদে চেয়ারম্যান বা সদস্য অনুপস্থিত, কোথাও প্যানেল চেয়ারম্যান বা প্রশাসক দায়িত্বে আছেন। অফিসে গিয়ে কে দায়িত্বে আছেন, জেনে নিন। ইউনিয়ন পরিষদের নাগরিক সনদে সেবার সময়সীমা ও অভিযোগ নিষ্পত্তির পদ্ধতি লেখা থাকার কথা।","In many Union Parishads the chairman or members are absent, and in some a panel chairman or administrator is in charge. Ask at the office who is in charge. The Union Parishad's citizen charter should list service timelines and how complaints are handled.","कई यूनियन परिषदों में चेयरमैन या सदस्य अनुपस्थित हैं और कहीं पैनल चेयरमैन या प्रशासक ज़िम्मेदारी में हैं। कार्यालय जाकर पूछ लें कि कौन प्रभारी है। यूनियन परिषद के नागरिक चार्टर में सेवाओं की समय-सीमा और शिकायत निपटारे की प्रक्रिया लिखी होनी चाहिए।"],

grs_h:["অনলাইনে বা ফোনে সরকারি অভিযোগ","Government complaint, online or by phone","ऑनलाइन या फ़ोन पर सरकारी शिकायत"],grs_p:["সরকারের অভিযোগ প্রতিকার ব্যবস্থার (জিআরএস) ওয়েবসাইট grs.gov.bd বা অ্যাপে অভিযোগ জানানো যায়। ৩৩৩ নম্বরে ফোন করেও জানানো যায়। সমাধান না হলে পরবর্তী ধাপে যাওয়ার ব্যবস্থাও এতে আছে।","You can file a complaint on the government's Grievance Redress System (GRS) website grs.gov.bd or its app, or by calling 333. It also has a way to escalate if the matter is not resolved.","सरकार की शिकायत निवारण प्रणाली (जीआरएस) की वेबसाइट grs.gov.bd या ऐप पर शिकायत की जा सकती है। 333 पर फ़ोन करके भी बता सकते हैं। समाधान न हो तो अगले चरण पर जाने की व्यवस्था भी इसमें है।"],
tl_h:["পরের কয়েক সপ্তাহের সময়সূচি","The next few weeks","अगले कुछ हफ़्तों का कार्यक्रम"],tl1h:["প্রথম সপ্তাহ","Week one","पहला हफ़्ता"],tl1:["প্রমাণ গুছিয়ে প্রথম ধাপের কাছে লিখিত আবেদন জমা দিন। রিসিভ কপি রাখুন।","Gather your evidence and submit a written application to the first-step office. Keep the receipt copy.","सबूत जुटाकर पहले चरण के कार्यालय में लिखित आवेदन जमा करें। रसीद की प्रति रखें।"],
tl2h:["দ্বিতীয় সপ্তাহ","Week two","दूसरा हफ़्ता"],tl2:["অগ্রগতি জানতে আবার যোগাযোগ করুন। প্রতিবেশীদের একই আবেদনে যুক্ত করুন।","Follow up on progress. Bring neighbours onto the same application.","प्रगति जानने के लिए फिर संपर्क करें। पड़ोसियों को इसी आवेदन में जोड़ें।"],
tl3h:["এক মাস পর","After a month","एक महीने बाद"],tl3:["কাজ বা উত্তর না পেলে আবেদনের কপিসহ দ্বিতীয় ধাপের দপ্তরে যান। তথ্য অধিকার আইনে ফরম ‘ক’-তে লিখিত আবেদন করলে দায়িত্বপ্রাপ্ত কর্মকর্তাকে অনুরোধ পাওয়ার পর সর্বোচ্চ ২০ কার্যদিবসের মধ্যে তথ্য দিতে হয়। না পেলে আপিল কর্তৃপক্ষের কাছে, তারপর তথ্য কমিশনে যাওয়া যায়।","If you get no work or reply, go to the second-step agency with a copy of the application. Under the Right to Information Act, a written application on Form ‘Ka’ must be answered by the responsible officer within 20 working days at most. If not, appeal to the appellate authority, then the Information Commission.","काम या जवाब न मिले तो आवेदन की प्रति लेकर दूसरे चरण के विभाग में जाएँ। सूचना का अधिकार कानून में फ़ॉर्म ‘क’ पर लिखित आवेदन पर ज़िम्मेदार अधिकारी को अधिकतम 20 कार्यदिवस में जानकारी देनी होती है। न मिले तो अपील प्राधिकारी, फिर सूचना आयोग में जाएँ।"],

ins1:["ড্রেনে ময়লা জমে পানি নামতে বাধা দিচ্ছে, এমন হতে পারে। ময়লা অপসারণ আর ড্রেন পরিষ্কারের আবেদন একসঙ্গে করুন।","Waste may be clogging the drains and stopping water from draining. Apply for waste removal and drain cleaning together.","हो सकता है नालियों में कचरा जमकर पानी निकलने से रोक रहा हो। कचरा हटाने और नाली की सफ़ाई का आवेदन साथ में करें।"],
ins2:["জমে থাকা পানিতে মশা জন্মায়। জলাবদ্ধতা না কমলে মশা ও ডেঙ্গুর ঝুঁকিও কমবে না, তাই দুটো বিষয় একসঙ্গে তুলুন।","Standing water breeds mosquitoes. Unless waterlogging eases, mosquito and dengue risk will not fall, so raise both together.","जमा पानी में मच्छर पनपते हैं। जलभराव कम हुए बिना मच्छर और डेंगू का खतरा भी कम नहीं होगा, इसलिए दोनों मुद्दे साथ उठाएँ।"],
ins3:["বিদ্যুৎ না থাকলে পানির পাম্প চলে না। দুটো সমস্যার সময় মিলিয়ে দেখুন, বিদ্যুৎ বিভ্রাটই পানির সমস্যার কারণ কি না।","Water pumps do not run without power. Compare the timing of both problems to see whether power cuts cause the water problem.","बिजली न हो तो पानी का पंप नहीं चलता। दोनों समस्याओं का समय मिलाकर देखें कि कहीं बिजली कटौती ही पानी की समस्या की वजह तो नहीं।"],
ins4:["ভাঙা রাস্তা যানজটের একটা বড় কারণ। রাস্তা মেরামত হলে যানজটও কমতে পারে।","Broken roads are a major cause of traffic jams. Repairing the road may ease the traffic too.","टूटी सड़कें जाम की एक बड़ी वजह हैं। सड़क बनने से जाम भी कम हो सकता है।"],
ins5:["পানির মান নিয়ে উদ্বেগ থাকলে ফুটিয়ে বা ফিল্টার করে খান, আর মান পরীক্ষার জন্য সংশ্লিষ্ট দপ্তরে জানান।","If you are worried about water quality, boil or filter it before drinking, and ask the relevant office to test it.","पानी की गुणवत्ता को लेकर चिंता हो तो उबालकर या फ़िल्टर करके पिएँ और जाँच के लिए संबंधित विभाग को बताएँ।"],
ins6:["একসঙ্গে অনেক বিষয়ে সমস্যা আছে। আলাদা আলাদা না জানিয়ে পাড়ার সবাই মিলে একটা সম্মিলিত আবেদন করলে বেশি কার্যকর হবে।","There are problems in many areas at once. Instead of reporting each separately, one joint application from the whole neighbourhood will be more effective.","एक साथ कई विषयों में समस्याएँ हैं। अलग-अलग बताने के बजाय पूरे मोहल्ले का एक साझा आवेदन ज़्यादा असरदार होगा।"],

ad_h:["অ্যাডমিন: সব জমা","Admin: all submissions","एडमिन: सभी प्रविष्टियाँ"],ad_p:["শুধু প্রকল্প পরিচালক দেখতে পারেন। নাম থাকে কেবল যাঁরা নাম দেখানোর সম্মতি দিয়েছেন।","Only the project owner can see this. Names appear only for people who consented to show them.","सिर्फ़ प्रोजेक्ट संचालक देख सकते हैं। नाम सिर्फ़ उन्हीं का दिखता है जिन्होंने नाम दिखाने की सहमति दी।"],ad_csv:["CSV সেভ করুন","Save as CSV","CSV सेव करें"],ad_e:["এখনো কোনো জমা নেই।","No submissions yet.","अभी कोई प्रविष्टि नहीं।"],ad_n:["মোট {n}টি মূল্যায়ন, {m}জন ব্যবহারকারী","{n} assessments from {m} users","{m} उपयोगकर्ताओं के {n} मूल्यांकन"],

ab1h:["এটা কী","What this is","यह क्या है"],ab1p:["এলাকার নাগরিক সেবা নিয়ে মানুষের নিজের অভিজ্ঞতা গুছিয়ে স্কোর ও করণীয় তৈরির একটা টুল। এটা সরকারি বা যাচাইকৃত তথ্য নয়, আপনার মতামতভিত্তিক মূল্যায়ন।","A tool that organises people's own experience of civic services into a score and a plan of action. It is not official or verified data, but an opinion-based assessment.","नागरिक सेवाओं के बारे में लोगों के अपने अनुभव को स्कोर और करने योग्य कदमों में ढालने वाला एक टूल। यह सरकारी या सत्यापित जानकारी नहीं, आपकी राय पर आधारित मूल्यांकन है।"],
ab2h:["স্কোর ও র‍্যাঙ্কিং কীভাবে হয়","How scores and rankings work","स्कोर और रैंकिंग कैसे बनते हैं"],ab2p:["৯টি বিষয়ে ১৭টি প্রশ্ন, প্রতিটি বিষয়ের আলাদা গুরুত্ব। একই বিষয়ে একাধিক প্রশ্নের গড় ধরা হয়। র‍্যাঙ্কিং শুধু সত্যিকারের জমা থেকে হয়, কোনো নমুনা বা বানানো সংখ্যা নেই। একটা এলাকার জমা কম হলে সেটা র‍্যাঙ্কিংয়ে আসে না। একজন একই এলাকায় ৩০ দিনে একবারের বেশি গোনা হন না।","17 questions across 9 topics, each topic weighted differently. Where a topic has several questions, the average is used. Rankings come only from real submissions, with no samples or made-up numbers. An area with too few entries is not ranked. One person counts at most once per area in 30 days.","9 विषयों पर 17 प्रश्न, हर विषय का अलग वज़न। एक विषय के कई प्रश्नों का औसत लिया जाता है। रैंकिंग सिर्फ़ असली प्रविष्टियों से बनती है, कोई नमूना या गढ़ी हुई संख्या नहीं। कम प्रविष्टियों वाला इलाका रैंकिंग में नहीं आता। एक व्यक्ति एक इलाके में 30 दिन में एक बार से ज़्यादा नहीं गिना जाता।"],
ab3h:["আপনার তথ্য","Your data","आपका डेटा"],ab3p:["আপনার সম্মতি ছাড়া কিছু শেয়ার হয় না। সম্মতি দিলে শুধু এলাকা, স্কোর ও লেখা সবাই দেখে, নাম নয়। নাম দেখানোর সম্মতি দিলে সেটা কেবল প্রকল্প পরিচালক দেখেন। ছবি আপনার ডিভাইসেই থাকে। লেখায় ফোন নম্বর থাকলে আগেই বাদ দেওয়া হয়। কেবল নিজের লেখা বিশ্লেষণ করলে সেই লেখাটুকু বিশ্লেষণের জন্য পাঠানো হয়। নিচের বাটনে সবকিছু মুছে ফেলা যায়।","Nothing is shared without your consent. If you consent, everyone sees only area, score and text, never your name. If you also consent to show your name, only the project owner sees it. Photos stay on your device. Phone numbers in your writing are removed first. Only if you have your own writing analysed is that text sent for analysis. You can delete everything with the button below.","आपकी सहमति के बिना कुछ भी साझा नहीं होता। सहमति देने पर सब सिर्फ़ इलाका, स्कोर और लेख देखते हैं, नाम नहीं। नाम दिखाने की सहमति दें तो उसे सिर्फ़ प्रोजेक्ट संचालक देखते हैं। तस्वीरें आपके डिवाइस पर ही रहती हैं। लेख में फ़ोन नंबर हो तो पहले हटा दिया जाता है। सिर्फ़ अपना लेख विश्लेषण कराने पर वही पाठ विश्लेषण के लिए भेजा जाता है। नीचे के बटन से सब कुछ मिटा सकते हैं।"],
ab4h:["আইনি প্রেক্ষাপট","Legal background","कानूनी पृष्ठभूमि"],ab4p:["২০২৬ সালে ব্যক্তিগত উপাত্ত সুরক্ষা আইন ও সাইবার সুরক্ষা আইন কার্যকর হয়েছে। এই টুলটি জানিয়ে সম্মতি নেওয়া, প্রয়োজনের বেশি তথ্য না নেওয়া আর মুছে ফেলার সুযোগ রাখার নীতি মাথায় রেখে বানানো। সাইবার সুরক্ষা আইনে মিথ্যা মামলা বা অভিযোগ দায়েরের জন্য শাস্তির বিধান আছে, তাই শুধু যা সত্যিই ঘটেছে, তা-ই লিখুন। এটা আইনি পরামর্শ নয়।","In 2026 the Personal Data Protection Act and the Cyber Security Act came into force. This tool is built with their principles in mind: informing and asking consent, not collecting more than needed, and allowing deletion. The Cyber Security Act has penalties for false cases or complaints, so write only what truly happened. This is not legal advice.","2026 में व्यक्तिगत डेटा सुरक्षा कानून और साइबर सुरक्षा कानून लागू हुए। यह टूल उनके सिद्धांतों को ध्यान में रखकर बना है: बताकर सहमति लेना, ज़रूरत से ज़्यादा जानकारी न लेना और मिटाने की सुविधा देना। साइबर सुरक्षा कानून में झूठे मामले या शिकायत पर सज़ा का प्रावधान है, इसलिए सिर्फ़ वही लिखें जो सच में हुआ। यह कानूनी सलाह नहीं है।"],
ab5h:["সীমাবদ্ধতা","Limitations","सीमाएँ"],ab5p:["দপ্তরের নামগুলো এলাকার ধরন (সিটি, পৌর, ইউনিয়ন) অনুযায়ী সাধারণ কাঠামো থেকে নেওয়া। এখন বহু স্থানীয় সরকার প্রতিষ্ঠানে প্রশাসক দায়িত্বে আছেন, নির্বাচনের পর কাঠামো বদলাতে পারে। জেলা ও উপজেলার তালিকা একটা সরকারি-ভিত্তিক ডেটাসেট থেকে, তাতে ঢাকা শহরের থানার নাম নেই, তাই সেখানে ‘অন্য’ বেছে লিখুন। কার্ডের মানচিত্রটা আনুমানিক রূপরেখা। হেল্পলাইন নম্বর বদলাতে পারে। ইংরেজি ও হিন্দি অনুবাদে ভুল থাকতে পারে।","Agency names follow a general structure by area type (city, pourashava, union). Many local bodies are now run by administrators and the structure may change after elections. The district and upazila list comes from a public dataset and does not include Dhaka city's thana names, so choose ‘Other’ and type it. The card's map is an approximate outline. Helpline numbers may change. English and Hindi translations may contain mistakes.","विभागों के नाम इलाके के प्रकार (सिटी, पौर, यूनियन) के अनुसार सामान्य ढाँचे से लिए गए हैं। अभी कई स्थानीय निकायों में प्रशासक ज़िम्मेदारी में हैं, चुनाव के बाद ढाँचा बदल सकता है। ज़िले और उपज़िले की सूची एक सार्वजनिक डेटासेट से है, उसमें ढाका शहर के थानों के नाम नहीं हैं, इसलिए ‘अन्य’ चुनकर लिखें। कार्ड का नक्शा अनुमानित रूपरेखा है। हेल्पलाइन नंबर बदल सकते हैं। अंग्रेज़ी और हिंदी अनुवाद में गलतियाँ हो सकती हैं।"],

 const A={ctx:null,started:false,off:false,cfg:{vol:.6,music:true,nature:true,ui:true,low:false},sc:{E:.7,mood:0,wx:0,busy:false,thanks:false},g:{},nx:{},ci:0,t0:0,iv:null,nz:null};
 const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],M=n=>440*Math.pow(2,(n-69)/12),P5=[0,2,4,7,9];
 const pn=i=>62+12*Math.floor(i/5)+P5[((i%5)+5)%5];           // ডি-মেজর পেন্টাটনিক: D E F# A B
 const now=()=>A.off?0:A.ctx.currentTime;
 const CH={maj:[[50,57,64,69],[47,54,62,66],[54,59,66,69],[45,52,59,64]],min:[[47,54,62,66],[45,52,59,64],[50,57,64,69],[54,59,66,69]]};

 function noiseBuf(c,kind,sec){const sr=c.sampleRate,n=Math.floor(sr*sec),b=c.createBuffer(1,n,sr),d=b.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;
   if(kind==="white")d[i]=w;
   else if(kind==="pink"){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
   else{last=(last+.02*w)/1.02;d[i]=last*3.5}}
  return b}
 function ir(c,sec){const sr=c.sampleRate,n=Math.floor(sr*sec),b=c.createBuffer(2,n,sr);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let y=0;for(let i=0;i<n;i++){const w=(Math.random()*2-1)*Math.pow(1-i/n,2.6);y+=(w-y)*(.18+.6*(1-i/n));d[i]=y}}return b}
 function adsr(g,t,a,peak,d,sus,rel,dur){const s=Math.max(.0001,peak*sus);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(s,t+a+d);g.gain.setValueAtTime(s,Math.max(t+a+d,t+dur));g.gain.exponentialRampToValueAtTime(.0001,Math.max(t+a+d,t+dur)+rel)}
 function route(node,dest,pan){const c=A.ctx;if(c.createStereoPanner&&pan!=null){const p=c.createStereoPanner();p.pan.value=pan;node.connect(p);p.connect(dest)}else node.connect(dest)}
 function noiseSrc(buf,t,dur,off){const s=A.ctx.createBufferSource();s.buffer=buf;if(dur>buf.duration-.1){s.loop=true;s.start(t,0);s.stop(t+dur)}else s.start(t,off==null?Math.random()*Math.max(0,buf.duration-dur-.05):off,dur);return s}

 /* ---------- সুরের কণ্ঠ ---------- */
 function padNote(t,midi,dur,pan,dest){const c=A.ctx,f=M(midi),g=c.createGain(),lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=650+900*A.sc.E;lp.Q.value=.4;
  [-7,7].forEach(dt=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+4.5)});
  adsr(g,t,2.6,.0105,1.5,.7,3.2,dur);lp.connect(g);route(g,dest||A.g.mus,pan)}
 function fluteNote(t,f,dur,prev){const c=A.ctx,g=c.createGain(),o=c.createOscillator(),o2=c.createOscillator(),g2=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
  o.type="sine";o2.type="triangle";const p=prev||f;o.frequency.setValueAtTime(p,t);o.frequency.exponentialRampToValueAtTime(f,t+.09);o2.frequency.setValueAtTime(p*2,t);o2.frequency.exponentialRampToValueAtTime(f*2,t+.09);
  lfo.frequency.value=5.1;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.007,t+.45);lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  g2.gain.value=.2;o.connect(g);o2.connect(g2);g2.connect(g);adsr(g,t,.16,.09,.3,.8,.75,dur);
  const n=noiseSrc(A.nz.white,t,dur+1),bp=c.createBiquadFilter(),ng=c.createGain();bp.type="bandpass";bp.frequency.value=f*2.1;bp.Q.value=6;n.connect(bp);bp.connect(ng);adsr(ng,t,.1,.012,.2,.6,.5,dur);ng.connect(g);
  route(g,A.g.mus,rnd(-.25,.25));[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+1.2)})}
 function pluck(t,midi,vel,dest,pan){const c=A.ctx,f=M(midi),g=c.createGain(),lp=c.createBiquadFilter(),o=c.createOscillator(),o2=c.createOscillator(),g2=c.createGain();
  o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2.003;lp.type="lowpass";lp.frequency.setValueAtTime(4800,t);lp.frequency.exponentialRampToValueAtTime(900,t+.5);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vel,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
  g2.gain.value=.35;o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);
  const n=noiseSrc(A.nz.white,t,.05),bp=c.createBiquadFilter(),ng=c.createGain();bp.type="bandpass";bp.frequency.value=3200;bp.Q.value=1.2;ng.gain.setValueAtTime(vel*.5,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.025);n.connect(bp);bp.connect(ng);ng.connect(g);
  route(g,dest||A.g.mus,pan==null?rnd(-.4,.4):pan);o.start(t);o2.start(t);o.stop(t+1.2);o2.stop(t+1.2)}
 function bell(t,midi,vel,dest,dur){const c=A.ctx,f=M(midi),d=dur||2.6,car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),g=c.createGain();
  car.frequency.value=f;mod.frequency.value=f*3.5;mg.gain.setValueAtTime(f*1.3,t);mg.gain.exponentialRampToValueAtTime(f*.02,t+1.2);mod.connect(mg);mg.connect(car.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vel,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);car.connect(g);route(g,dest||A.g.mus,rnd(-.3,.3));car.start(t);mod.start(t);car.stop(t+d+.1);mod.stop(t+d+.1)}
 function bowl(t,midi,vel,dest){const c=A.ctx,f=M(midi),g=c.createGain();[[1,1],[2.71,.5],[5.15,.25],[1.003,.7]].forEach(([r,a])=>{const o=c.createOscillator(),og=c.createGain();o.frequency.value=f*r;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+7)});
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vel,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+6.5);route(g,dest||A.g.mus,0)}

 /* ---------- প্রকৃতির কণ্ঠ ---------- */
 function koel(t,pan){const c=A.ctx,base=rnd(900,1080),n=pick([3,4,5]);for(let i=0;i<n;i++){const st=t+i*.46,f0=base*(1+i*.07),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(f0,st);o.frequency.exponentialRampToValueAtTime(f0*1.55,st+.34);g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(.065,st+.05);g.gain.exponentialRampToValueAtTime(.0001,st+.37);route(o,g,0);route(g,A.g.nat,pan);o.start(st);o.stop(st+.4)}}
 function chirps(t,pan){const c=A.ctx,n=pick([4,5,6,7]);let st=t;for(let i=0;i<n;i++){const f=rnd(3000,4600),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(f,st);o.frequency.exponentialRampToValueAtTime(f*.62,st+.06);g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(.024,st+.01);g.gain.exponentialRampToValueAtTime(.0001,st+.07);o.connect(g);route(g,A.g.nat,pan);o.start(st);o.stop(st+.09);st+=rnd(.09,.15)}}
 function dove(t,pan){const c=A.ctx,f=rnd(390,430),ds=[.34,.34,.34,.75];let st=t;ds.forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(f*1.04,st);o.frequency.exponentialRampToValueAtTime(f*.96,st+d);g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(.042,st+.12);g.gain.exponentialRampToValueAtTime(.0001,st+d+.15);o.connect(g);route(g,A.g.nat,pan);o.start(st);o.stop(st+d+.2);st+=d+.22})}
 function cricket(t,pan){const c=A.ctx;for(let k=0;k<3;k++){const st=t+k*.045,o=c.createOscillator(),g=c.createGain();o.frequency.value=4300;g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(.009,st+.008);g.gain.exponentialRampToValueAtTime(.0001,st+.03);o.connect(g);route(g,A.g.nat,pan);o.start(st);o.stop(st+.04)}}
 function drop(t){const c=A.ctx,bp=c.createBiquadFilter(),g=c.createGain(),n=noiseSrc(A.nz.white,t,.06);bp.type="bandpass";bp.frequency.value=rnd(2000,6500);bp.Q.value=rnd(1.5,4);const v=rnd(.012,.04);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+rnd(.025,.05));n.connect(bp);bp.connect(g);route(g,A.g.nat,rnd(-.8,.8))}
 function thunder(t,near){const c=A.ctx,lp=c.createBiquadFilter(),g=c.createGain(),n=noiseSrc(A.nz.brown,t,8,0),rv=c.createGain();lp.type="lowpass";lp.frequency.setValueAtTime(520,t);lp.frequency.exponentialRampToValueAtTime(70,t+6);
  const pk=near?.5:.28,at=rnd(.5,1.3);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+7);n.connect(lp);lp.connect(g);g.connect(A.g.nat);rv.gain.value=.6;g.connect(rv);rv.connect(A.g.rev);
  if(near){const k=noiseSrc(A.nz.white,t,.2),bp=c.createBiquadFilter(),kg=c.createGain();bp.type="bandpass";bp.frequency.value=1100;kg.gain.setValueAtTime(.06,t);kg.gain.exponentialRampToValueAtTime(.0001,t+.18);k.connect(bp);bp.connect(kg);kg.connect(A.g.nat)}}

 /* ---------- গ্রাফ ---------- */
 A.init=function(ctx,offline){
  const c=A.ctx=ctx;A.off=!!offline;A.t0=offline?0:c.currentTime;
  const out=c.createGain();out.gain.value=0;A.g.master=out;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=24;comp.ratio.value=3.5;comp.attack.value=.01;comp.release.value=.35;
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=14000;out.connect(comp);comp.connect(lp);lp.connect(c.destination);
  const an=c.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.8;out.connect(an);A.an=an;A.fd=new Uint8Array(an.frequencyBinCount);
  const conv=c.createConvolver();conv.buffer=ir(c,A.cfg.low?1.6:2.8);const rv=c.createGain();rv.gain.value=.9;conv.connect(rv);rv.connect(out);A.g.rev=conv;
  const mk=(send)=>{const b=c.createGain();b.connect(out);const s=c.createGain();s.gain.value=send;b.connect(s);s.connect(conv);return b};
  A.g.music=mk(.55);A.g.nature=mk(.22);A.g.ui=mk(.3);
  const mlp=c.createBiquadFilter();mlp.type="lowpass";mlp.frequency.value=4000;mlp.Q.value=.3;const mus=c.createGain();mus.connect(mlp);mlp.connect(A.g.music);A.g.mus=mus;A.g.mlp=mlp;A.g.nat=A.g.nature;
  const nz=A.nz={white:noiseBuf(c,"white",3),pink:noiseBuf(c,"pink",4),brown:noiseBuf(c,"brown",4)};
  const loop=b=>{const s=c.createBufferSource();s.buffer=b;s.loop=true;s.start(A.t0);return s};
  {const s=loop(nz.pink),bp=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();bp.type="bandpass";bp.frequency.value=620;bp.Q.value=.55;g.gain.value=0;l.frequency.value=.07;lg.gain.value=260;l.connect(lg);lg.connect(bp.frequency);s.connect(bp);bp.connect(g);g.connect(A.g.nat);l.start(A.t0);A.g.wind=g}
  {const s=loop(nz.brown),lpf=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();lpf.type="lowpass";lpf.frequency.value=480;g.gain.value=0;l.frequency.value=.23;lg.gain.value=.006;l.connect(lg);lg.connect(g.gain);s.connect(lpf);lpf.connect(g);g.connect(A.g.nat);l.start(A.t0);A.g.river=g}
  {const s=loop(nz.white),hp=c.createBiquadFilter(),lpf=c.createBiquadFilter(),g=c.createGain();hp.type="highpass";hp.frequency.value=1600;lpf.type="lowpass";lpf.frequency.value=7500;g.gain.value=0;s.connect(hp);hp.connect(lpf);lpf.connect(g);g.connect(A.g.nat);A.g.rain=g}
  {const g=c.createGain(),lpd=c.createBiquadFilter(),l=c.createOscillator(),lg=c.createGain();lpd.type="lowpass";lpd.frequency.value=700;g.gain.value=0;l.frequency.value=.11;lg.gain.value=3;
   [[50,"triangle",1],[57,"triangle",.8],[62,"sine",.5]].forEach(([m,ty,a])=>{const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=M(m);og.gain.value=a;l.connect(lg);lg.connect(o.detune);o.connect(og);og.connect(lpd);o.start(A.t0)});
   l.start(A.t0);lpd.connect(g);g.connect(A.g.mus);A.g.drone=g}
  A.apply(true);return A};

 A.setCfg=function(o){Object.assign(A.cfg,o||{});if(!A.ctx)return;const t=now();
  A.g.master.gain.setTargetAtTime(A.started?A.cfg.vol*1.7:0,t,A.started?.5:.25);
  A.g.music.gain.setTargetAtTime(A.cfg.music?1:0,t,.6);A.g.nature.gain.setTargetAtTime(A.cfg.nature?1:0,t,.6);A.g.ui.gain.setTargetAtTime(A.cfg.ui?1:0,t,.1)};
 A.setScene=function(o){Object.assign(A.sc,o||{});if(A.ctx)A.apply()};
 A.apply=function(first){const s=A.sc,E=s.E,t=now(),tc=first?.05:1.4,set=(p,v)=>p.setTargetAtTime(v,t,tc);
  set(A.g.wind.gain,.026+.018*(s.wx>=2?1:0)+.01*(1-E));set(A.g.river.gain,s.wx>=3?0:.017*(1.1-E));
  set(A.g.rain.gain,s.wx===3?.05:s.wx===4?.085:0);set(A.g.drone.gain,.02+.014*E);set(A.g.mlp.frequency,1500+5500*E)};
 A.level=function(){if(!A.an||!A.started)return null;try{A.an.getByteFrequencyData(A.fd)}catch(e){return null}const d=A.fd,avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=d[i];return s/((b-a)*255)};const l=avg(0,4),m=avg(4,16),h=avg(16,48);return{all:Math.min(1,(l*.5+m*.35+h*.15)*2.4),l:Math.min(1,l*2.2),m:Math.min(1,m*2.8),h:Math.min(1,h*4.5)}};
 A.duck=function(on){if(!A.ctx)return;const t=now();A.g.music.gain.setTargetAtTime(on?.25:(A.cfg.music?1:0),t,.3);A.g.nature.gain.setTargetAtTime(on?.35:(A.cfg.nature?1:0),t,.3)};
 A.start=function(){const c=A.ctx;if(!c||A.started)return;A.started=true;const t=now();
  ["chord","mel","plk","bell","bird","drop","thd","cri","ping"].forEach((k,i)=>A.nx[k]=t+.4+i*.3);A.nx.chord=t+.05;A.nx.mel=t+3.5;A.nx.plk=t+5;A.nx.bell=t+9;
  A.setCfg();if(!A.off){A.iv=setInterval(()=>A.sched(c.currentTime+1.9),400);A.sched(c.currentTime+1.9)}};
 A.stop=function(){if(!A.ctx||!A.started)return;A.started=false;A.setCfg();clearInterval(A.iv)};

 /* ---------- জেনারেটিভ সুর ও প্রকৃতি ---------- */
 A.sched=function(until){
  if(!A.started&&!A.off)return;const s=A.sc,n=A.nx,t=now(),E=s.E,mood=s.mood,mus=A.cfg.music,nat=A.cfg.nature;
  const cd=mood?10.5:8;
  while(n.chord<until){const tt=Math.max(n.chord,t+.05);if(mus){CH[mood?"min":"maj"][A.ci%4].forEach((m,i)=>padNote(tt+i*.12,m,cd-1.2,rnd(-.6,.6)))}A.ci++;n.chord=tt+cd}
  while(n.mel<until){const tt=Math.max(n.mel,t+.05);let end=tt;
   if(mus){let i=pick([2,3,5,6,7]),len=pick([3,4,5]),tm=tt,prev=null;for(let k=0;k<len;k++){const f=M(pn(i)),d=rnd(1,2.1);fluteNote(tm,f,d,prev);prev=f;tm+=d*.92;i=Math.max(2,Math.min(9,i+pick([-2,-1,-1,1,1,2])))}
    const tn=pick(mood?[4,9]:[0,5]);fluteNote(tm,M(pn(tn)),2.4,prev);end=tm+2.4}
   n.mel=end+rnd(3,6.5)/(.4+E)}
  while(n.plk<until){const tt=Math.max(n.plk,t+.05);if(mus){let i=pick([5,6,7,8]),dir=pick([-1,1]);const len=pick([3,4,5]);for(let k=0;k<len;k++){pluck(tt+k*.21,pn(i),rnd(.07,.1));i=Math.max(3,Math.min(10,i+dir))}}n.plk=tt+rnd(3,7)/(.3+E)}
  while(n.bell<until){const tt=Math.max(n.bell,t+.05);if(mus&&E>.25)bell(tt,pn(pick([10,11,12,13])),.034,null,3.2);n.bell=tt+rnd(14,28)}
  while(n.bird<until){const tt=Math.max(n.bird,t+.05);
   if(nat){if(s.wx<=1){const k=Math.random();if(k<.35)koel(tt,rnd(-.7,.7));else if(k<.8)chirps(tt,rnd(-.8,.8));else dove(tt,rnd(-.5,.5))}else if(s.wx===3&&Math.random()<.4)dove(tt,rnd(-.5,.5))}
   n.bird=tt+rnd(7,16)*(1.4-E)}
  while(n.cri<until){const tt=Math.max(n.cri,t+.05);if(nat&&s.wx===2)cricket(tt,rnd(-.8,.8));n.cri=tt+rnd(1.2,2.8)}
  const rate=s.wx===3?22:s.wx===4?40:0;
  while(n.drop<until){const tt=Math.max(n.drop,t);if(nat&&rate)drop(tt);n.drop=tt+(rate?1/rate*rnd(.5,1.6):.5)}
  while(n.thd<until){const tt=Math.max(n.thd,t+.05);if(nat&&s.wx===4)thunder(tt,Math.random()<.3);else if(nat&&s.wx===3&&Math.random()<.25)thunder(tt,false);n.thd=tt+(s.wx===4?rnd(12,24):rnd(35,60))}
  while(n.ping<until){const tt=Math.max(n.ping,t+.05);if(s.busy&&A.cfg.ui)A.sfx("ping",0,tt);n.ping=tt+1.8}};

 /* ---------- ইন্টারফেসের শব্দ ---------- */
 A.sfx=function(kind,arg,at){
  if(!A.ctx||(!A.started&&!A.off)||!A.cfg.ui)return;const c=A.ctx,t=at==null?now()+.005:at,U=A.g.ui;
  const tone=(f,t0,d,v,ty)=>{const o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.004);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(U);o.start(t0);o.stop(t0+d+.05)};
  if(kind==="tap"){const idx=[3,2,1,0][Math.max(0,Math.min(3,arg|0))],f=M(pn(5+idx));tone(f,t,.16,.13);tone(f*2,t,.09,.04);const n=noiseSrc(A.nz.white,t,.02),hp=c.createBiquadFilter(),g=c.createGain();hp.type="highpass";hp.frequency.value=3000;g.gain.setValueAtTime(.03,t);g.gain.exponentialRampToValueAtTime(.0001,t+.012);n.connect(hp);hp.connect(g);g.connect(U)}
  else if(kind==="pin"){const dr=(t0,f0,v)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f0*.22,t0+.13);g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+.2);o.connect(g);g.connect(U);o.start(t0);o.stop(t0+.25)};dr(t,1700,.13);dr(t+.09,1150,.06)}
  else if(kind==="whoosh"){const n=noiseSrc(A.nz.white,t,.5),bp=c.createBiquadFilter(),g=c.createGain();bp.type="bandpass";bp.Q.value=1.1;bp.frequency.setValueAtTime(500,t);bp.frequency.exponentialRampToValueAtTime(2600,t+.35);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.4);n.connect(bp);bp.connect(g);route(g,U,rnd(-.3,.3))}

function dataUrlBlob(u){const p=u.split(","),m=/:(.*?);/.exec(p[0])[1],bin=atob(p[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
const blobOf=(c,ty,q)=>new Promise(r=>{let done=false;const fin=b=>{if(!done){done=true;r(b)}};
 const viaUrl=()=>{try{fin(dataUrlBlob(c.toDataURL(ty,q)))}catch(e){fin(null)}};
 try{c.toBlob(b=>{if(b)fin(b);else viaUrl()},ty,q)}catch(e){viaUrl()}setTimeout(()=>fin(null),25000)});
async function pdfOf(cs,pw,ph){
 const enc=new TextEncoder(),parts=[],off=[];let len=0;const push=u=>{parts.push(u);len+=u.length};
 const obj=(n,b,st)=>{off[n]=len;push(enc.encode(`${n} 0 obj\n${b}\n`));if(st){push(enc.encode("stream\n"));push(st);push(enc.encode("\nendstream\n"))}push(enc.encode("endobj\n"))};
 const N=cs.length;push(enc.encode("%PDF-1.4\n"));push(new Uint8Array([37,226,227,207,211,10]));
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
 obj(2,`<< /Type /Pages /Kids [${cs.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] /Count ${N} >>`);
 for(let i=0;i<N;i++){const jbl=await blobOf(cs[i],"image/jpeg",.92);if(!jbl)throw new Error("jpeg");const jb=new Uint8Array(await jbl.arrayBuffer());
  obj(3+i*3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${5+i*3} 0 R >> >> /Contents ${4+i*3} 0 R >>`);
  const cc=enc.encode(`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`);obj(4+i*3,`<< /Length ${cc.length} >>`,cc);
  obj(5+i*3,`<< /Type /XObject /Subtype /Image /Width ${cs[i].width} /Height ${cs[i].height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>`,jb)}
 obj(3+N*3,"<< /Producer (Bhoganti) /Title (Bhoganti) >>");const tot=4+N*3,xo=len;let x=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let n=1;n<tot;n++)x+=String(off[n]).padStart(10,"0")+" 00000 n \n";
 x+=`trailer\n<< /Size ${tot} /Root 1 0 R /Info ${3+N*3} 0 R >>\nstartxref\n${xo}\n%%EOF`;push(enc.encode(x));return new Blob(parts,{type:"application/pdf"});
}
let DLBUSY=false;
function setDlBusy(on){DLBUSY=on;$$("[data-dl],#rl,#rls,#lpdf,#ldl,#pdl").forEach(x=>{x.disabled=on})}
async function deliver(name,blob,el){
 const say=m=>{if(el)el.textContent=m};
 if(!blob||!blob.size){say(t("dl_fail"));return false}
 let dl=null;try{dl=window.claude&&claude.use?await tmo(claude.use("downloads"),4000):null}catch(e){dl=null}
 if(dl){say(t("dl_ask"));
  try{await dl.save({filename:name,data:blob});say(t("dl_ok"));return true}
  catch(err){const c=err&&err.code;
   if(c==="declined"){say(t("dl_decl"));return false}
   if(c==="rate_limited"){say(t("dl_rate"));return false}
   if(c==="too_large"){say(t("dl_big"));return false}}}
 return browserSave(name,blob,el)}
function browserSave(name,blob,el){
 const say=m=>{if(el)el.textContent=m};
 try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1500);
  const fa=$("dlfa");fa.href=u;fa.download=name;fa.textContent=t("dl_fb",{n:name});$("dlfb").style.display="block";
  const im=$("dlfi");if(/^image\//.test(blob.type)){im.src=u;im.style.display="block"}else im.style.display="none";
  say(t("dl_br"));return true}catch(e){say(t("dl_no"));return false}}
async function saveBlob(name,blob,el){if(DLBUSY)return false;setDlBusy(true);try{return await deliver(name,blob,el)}finally{setDlBusy(false)}}
const fname=ext=>`bhoganti-${GEO[S.cur.d][6].replace(/\W+/g,"-")}-${S.ctheme}.${ext}`;
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-dl]");if(!b||!S.cur||DLBUSY)return;
 const ty=b.dataset.dl,el=$("dln");setDlBusy(true);$("dlfb").style.display="none";
 try{
  el.textContent=t("dl_mk");await fonts();await new Promise(r=>setTimeout(r,30));
  let m=RESM[S.res],blob=null,tries=0;
  while(!blob&&tries<3){
   try{const cv=drawCard(S.fmt,S.ctheme,m);blob=ty==="png"?await blobOf(cv,"image/png"):ty==="jpg"?await blobOf(cv,"image/jpeg",.92):await pdfOf([cv],540,Math.round(cv.height/cv.width*540))}catch(er){blob=null}
   if(!blob){m=Math.max(2/3,m*.75);tries++;if(tries<3)el.textContent=t("dl_lower")}}
  if(!blob){el.textContent=t("dl_fail");return}
  award("share");await deliver(fname(ty),blob,el);
 }finally{setDlBusy(false)}
});

async function letterPages(text){
 await fonts();const W=1240,Hh=1754,m=110,lh=54,fs=32,pages=[];let c,g,y;
 const np=()=>{c=document.createElement("canvas");c.width=W;c.height=Hh;g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,Hh);g.fillStyle="#0f172a";g.font=`400 ${fs}px ${FONT}`;g.textBaseline="alphabetic";g.textAlign="left";y=m+fs;pages.push(c)};
 np();
 text.split("\n").forEach(par=>{
  if(!par.trim()){y+=lh*.6;return}
  let line="";const flush=()=>{if(y>Hh-m)np();g.fillText(line,m,y);y+=lh;line=""};
  par.split(" ").forEach(w=>{const s=line?line+" "+w:w;if(g.measureText(s).width>W-2*m&&line){flush();line=w}else line=s});
  if(line)flush()});
 const ph=S.photos;
 for(let i=0;i<ph.length;i+=4){np();g.font=`700 36px ${FONT}`;g.fillText("সংযুক্তি: প্রমাণের ছবি",m,m+36);
  const cw=(W-2*m-30)/2,chh=640;
  ph.slice(i,i+4).forEach((p,k)=>{const x=m+(k%2)*(cw+30),yy=m+90+Math.floor(k/2)*(chh+70),im=p.img,s=Math.min(cw/im.width,chh/im.height),w=im.width*s,h=im.height*s;
   g.drawImage(im,x+(cw-w)/2,yy+(chh-h)/2,w,h);g.font=`400 26px ${FONT}`;g.fillStyle="#667085";g.fillText("সংযুক্তি "+toBn(i+k+1),x,yy+chh+36);g.fillStyle="#0f172a"})}
 return pages;
}
